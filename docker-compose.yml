services:
  # ── Init Database (seed from local backup on first run) ───────────────────
  init-db:
    image: alpine:3.22
    volumes:
      - sqlite_data:/data
      - ./backend/expense.db:/seed/expense.db:ro
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/expense.db ]; then
          echo "Initializing database from local backup..."
          cp /seed/expense.db /data/expense.db
          echo "Database initialized."
        else
          echo "Database already exists; skipping initialization."
        fi
        chown -R 1000:1000 /data
        chmod 750 /data
        chmod 660 /data/expense.db

  # ── Run schema migrations (idempotent, runs before backend starts) ─────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-tracker-migrate
    restart: "no"
    environment:
      DATABASE_URL: sqlite:////data/expense.db
    volumes:
      - sqlite_data:/data
    command: ["python", "migrations/migrate.py"]
    depends_on:
      init-db:
        condition: service_completed_successfully

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/expense.db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
    volumes:
      # Persist the SQLite database file across container restarts
      - sqlite_data:/data
    ports:
      # Expose directly for local API testing / Swagger UI
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      init-db:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api/ calls are proxied by nginx to the backend service
        VITE_API_BASE_URL: /api/v1
    container_name: expense-tracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
    driver: local
